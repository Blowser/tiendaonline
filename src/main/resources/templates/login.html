<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotomTech | Iniciar Sesión</title>

    <link rel="stylesheet" href="/css/rotomtech.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-area">
                <img
                    src="/img/rotomtech-logo-oficial.jpg"
                    alt="RotomTech Logo"
                    class="logo-rotom">
                <p>Tecnología de Alto Voltaje</p>
            </div>

            <form id="loginForm">

                <div class="input-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="admin@rotomtech.cl"
                        required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="********"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn-login">

                    Ingresar

                </button>

                <p id="mensaje"></p>

            </form>

        </div>

    </div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event){

    event.preventDefault();

    const correo =
        document.getElementById("correo")
        .value;

    const password =
        document.getElementById("password")
        .value;

    const response =
        await fetch(
            "/usuarios/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    correo,
                    password
                })
            });

    const mensaje =
        document.getElementById("mensaje");

        if(response.ok){

        const usuario =
            await response.json();

        localStorage.setItem(
            "usuario",
            JSON.stringify(usuario)
        );

        window.location.href =
            "/perfil";
    


    } else {

        mensaje.innerText =
            "Credenciales inválidas";
    }

});

</script>

</body>
</html>
